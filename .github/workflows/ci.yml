name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Documentation-only merges skip the code pipeline. Keep PRs unfiltered so
    # required checks always report. Do not ignore app content markdown, which
    # is a build input for the landing site.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "mintlify/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:build-config
      - run: node --test scripts/p1-parity-contract.test.mjs
      - run: node --test scripts/p1-single-host-gateway.test.mjs
      - run: pnpm typecheck
      - run: pnpm --filter @lobbystack/admin --filter @lobbystack/landing lint
      - run: pnpm telemetry:coverage
      - run: pnpm build
      - name: Validate the French help center and exported review links
        run: |
          pnpm docs:validate
          pnpm --filter @lobbystack/docs check:content
          pnpm docs:broken-links
          node scripts/build-help-preview.mjs apps/landing/dist/aide
          node scripts/verify-v1-preview.mjs apps/landing/dist
          node scripts/p1-parity-contract.mjs apps/landing/dist
      - name: Verify the committed embed loader matches the build
        run: git diff --exit-code -- apps/admin/public/embed/embed.js
      - run: pnpm test
      - run: pnpm replacement:telemetry
      - name: Validate Compose config
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

  # The Zapier integration is a standalone npm package on the Node version
  # Zapier runs (22). Its tests mock every HTTP call.
  zapier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json
      - run: npm ci
      - run: npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      LOBBYSTACK_SKIP_ENV_FILES: "true"
      DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_RELIABILITY_TEST_DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_AUTH_TEST_DATABASE_URL: postgres://postgres:lobbystack@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_APP_DATABASE_URL: postgres://lobbystack_app:app@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_AUTH_DATABASE_URL: postgres://lobbystack_auth:auth@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_WORKER_DATABASE_URL: postgres://lobbystack_worker:worker@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_DISPATCHER_DATABASE_URL: postgres://lobbystack_dispatcher:dispatcher@127.0.0.1:5432/lobbystack_test
      LOBBYSTACK_APP_PASSWORD: app
      LOBBYSTACK_AUTH_PASSWORD: auth
      LOBBYSTACK_WORKER_PASSWORD: worker
      LOBBYSTACK_DISPATCHER_PASSWORD: dispatcher
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_URL: redis://127.0.0.1:6379
      VERIFY_RLS_BEHAVIOR: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lobbystack
          POSTGRES_DB: lobbystack_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d lobbystack_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - name: Migrate and bootstrap twice
        run: |
          for pass in 1 2; do
            pnpm db:migrate
            pnpm --filter @lobbystack/db exec tsx src/cli.ts bootstrap
          done
      - run: pnpm db:check
      - run: pnpm db:verify-rls
      - name: Prove durable outbox recovery after isolated Redis queue loss
        env:
          LOBBYSTACK_OUTBOX_REDIS_RECOVERY_INTEGRATION: "true"
        run: pnpm --filter @lobbystack/worker exec vitest run src/outboxRecovery.integration.test.ts
      - name: Test transactional reliability with PostgreSQL roles
        run: pnpm test:reliability
      - name: Qualify managed pilots, receptionist actions and durable receipts
        run: |
          pnpm --filter @lobbystack/domain exec vitest run src/server/pilotActivation.integration.test.ts src/server/receptionistActions.integration.test.ts
          pnpm --filter @lobbystack/db exec vitest run src/outbox.integration.test.ts
      - name: Test verification persistence and concurrent quotas
        run: pnpm --filter @lobbystack/admin exec vitest run src/lib/auth-issuance.integration.test.ts src/lib/email-verification-policy.test.ts
      - name: Test live-call presence against Redis
        run: pnpm --filter @lobbystack/admin exec vitest run src/lib/voice-presence.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @lobbystack/admin exec playwright install --with-deps chromium
      - name: Run supported browser journeys against an isolated stack
        run: bash scripts/e2e-local.sh
      - name: Keep rendered fixture screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-browser-screenshots
          path: |
            apps/admin/test-results/**/*.png
            apps/admin/test-results/**/p1-gateway-real-next-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  images:
    uses: ./.github/workflows/runtime-images.yml

  validate:
    if: always()
    needs: [checks, database, e2e, images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all PR and release gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); if (Object.values(results).some(job => job.result !== "success")) process.exit(1);'

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PRODUCTION_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: production
      RAILWAY_SERVICE: migrator
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicitly configured production project
        shell: bash
        run: |
          if [[ ! "$RAILWAY_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Set RAILWAY_PRODUCTION_PROJECT_ID only after verifying the target project and approving the production rollout. No default project is used."
            exit 1
          fi
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.57.9
      - name: Verify release is current
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Skipping superseded release ${GITHUB_SHA}; main is ${remote_sha}."
            exit 1
          fi
      - name: Run production migrations
        run: >-
          railway up
          --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_SERVICE"
          --message "GitHub ${GITHUB_SHA}"
      - name: Confirm release is current
        run: |
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Blocking superseded release ${GITHUB_SHA}; main is ${remote_sha}."
            exit 1
          fi
