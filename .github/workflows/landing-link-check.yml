name: Landing link check

on:
  push:
    paths:
      - "apps/landing/src/**"
      - "apps/landing/functions/**"
      - "apps/landing/public/**"
      - "apps/landing/scripts/**"
      - "apps/landing/astro.config.mjs"
      - "mintlify/**"
      - "scripts/build-help-preview.mjs"
      - "scripts/verify-v1-preview.mjs"
      - ".github/workflows/landing-link-check.yml"
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbystack/landing build
      - run: pnpm --filter @lobbystack/landing seo:validate
      - name: Export help and check every rendered local target
        run: |
          node scripts/build-help-preview.mjs apps/landing/dist/aide
          node scripts/verify-v1-preview.mjs apps/landing/dist
      - name: Start landing preview server
        run: |
          npx --yes serve apps/landing/dist -l 4173 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "Landing preview server failed to start"
          exit 1
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --base-url http://127.0.0.1:4173
            --remap '^https://caleonis-receptionist-v1-review\.willgosse225\.chatgpt\.site(.*) http://127.0.0.1:4173$1'
            --remap '^https://reception\.caleonis\.com(.*) http://127.0.0.1:4173$1'
            --remap '^https://lobbystack\.com(.*) http://127.0.0.1:4173$1'
            --exclude '^https://app\.lobbystack\.com/'
            --exclude '^http://localhost:3000/api/voice/live/'
            --exclude '^https://theresanaiforthat\.com/ai/lobbystack/'
            --exclude '^https://www\.bls\.gov/ooh/Office-and-Administrative-Support/Receptionists\.htm$'
            --exclude '^https://www\.hhs\.gov/hipaa/for-professionals/special-topics/health-information-technology/cloud-computing/$'
            --exclude '^https://openai\.com/api/pricing/$'
            --exclude '^https://www\.twilio\.com/'
            './apps/landing/dist/**/*.html'
          fail: true
